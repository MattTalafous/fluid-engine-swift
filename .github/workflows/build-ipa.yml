name: Build unsigned IPA

on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: List schemes
        run: |
          xcodebuild \
            -project vox.Force.xcodeproj \
            -list

      - name: Build unsigned iOS app
        run: |
          xcodebuild \
            -project vox.Force.xcodeproj \
            -scheme vox.Force \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build

      - name: Find built app
        run: |
          find "$PWD/build" -type d -name "*.app" -print

      - name: Package IPA
        run: |
          APP_PATH="$(find "$PWD/build/Build/Products" -type d -name "vox.Force.app" | head -n 1)"

          if [ -z "$APP_PATH" ]; then
            echo "vox.Force.app not found"
            exit 1
          fi

          echo "Using app at: $APP_PATH"

          mkdir -p Payload
          cp -R "$APP_PATH" Payload/

          zip -r vox.Force.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: vox.Force-unsigned-ipa
          path: vox.Force.ipa
