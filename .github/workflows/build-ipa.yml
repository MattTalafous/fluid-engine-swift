name: Build unsigned IPA

on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Show environment
        run: |
          set -euxo pipefail
          xcodebuild -version
          swift --version
          uname -a

      - name: Install XcodeGen
        run: |
          set -euxo pipefail
          brew install xcodegen

      - name: Generate Xcode project
        run: |
          set -euxo pipefail
          xcodegen generate

          if [ ! -d "vox.Force.xcodeproj" ]; then
            echo "ERROR: vox.Force.xcodeproj was not generated"
            exit 1
          fi

      - name: List project
        run: |
          set -euxo pipefail
          xcodebuild \
            -project vox.Force.xcodeproj \
            -list

      - name: Build unsigned iOS app
        run: |
          set +e

          rm -rf "$PWD/build"
          rm -f "$PWD/build.log"

          xcodebuild \
            -project vox.Force.xcodeproj \
            -scheme vox.Force \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$PWD/build" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            clean build 2>&1 | tee "$PWD/build.log"

          BUILD_STATUS=${PIPESTATUS[0]}

          echo ""
          echo "======================================"
          echo "COMPILER ERRORS"
          echo "======================================"

          grep -nEi \
            '(^|[[:space:]])(error:|fatal error:)|:[0-9]+:[0-9]+: error:' \
            "$PWD/build.log" \
            | tail -120 || true

          echo ""
          echo "======================================"
          echo "METAL / SWIFT ERROR CONTEXT"
          echo "======================================"

          grep -nEi \
            -B 8 -A 12 \
            'error:|fatal error:|\.metal:[0-9]+:[0-9]+:|\.swift:[0-9]+:[0-9]+:' \
            "$PWD/build.log" \
            | tail -250 || true

          echo ""
          echo "xcodebuild exit status: $BUILD_STATUS"

          exit $BUILD_STATUS

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcode-build-log
          path: build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Inspect build products
        if: success()
        run: |
          set -euxo pipefail

          echo "======================================"
          echo "BUILD PRODUCTS"
          echo "======================================"

          find "$PWD/build/Build/Products" -maxdepth 6 -print

          APP_PATH="$(find "$PWD/build/Build/Products" \
            -type d \
            -name "vox.Force.app" \
            -print \
            -quit)"

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: vox.Force.app not found"
            exit 1
          fi

          echo "APP_PATH=$APP_PATH"

          echo "======================================"
          echo "APP CONTENTS"
          echo "======================================"

          ls -la "$APP_PATH"
          find "$APP_PATH" -maxdepth 3 -print

          if [ ! -f "$APP_PATH/Info.plist" ]; then
            echo "ERROR: Info.plist missing"
            exit 1
          fi

          echo "======================================"
          echo "INFO.PLIST"
          echo "======================================"

          plutil -p "$APP_PATH/Info.plist"

          EXECUTABLE_NAME="$(
            /usr/libexec/PlistBuddy \
              -c 'Print :CFBundleExecutable' \
              "$APP_PATH/Info.plist"
          )"

          echo "CFBundleExecutable=$EXECUTABLE_NAME"

          EXECUTABLE_PATH="$APP_PATH/$EXECUTABLE_NAME"

          if [ ! -e "$EXECUTABLE_PATH" ]; then
            echo "ERROR: Expected executable does not exist"
            exit 1
          fi

          if [ ! -f "$EXECUTABLE_PATH" ]; then
            echo "ERROR: Expected executable is not a regular file"
            ls -ld "$EXECUTABLE_PATH"
            exit 1
          fi

          echo "======================================"
          echo "EXECUTABLE INFO"
          echo "======================================"

          ls -lh "$EXECUTABLE_PATH"
          file "$EXECUTABLE_PATH"

          if ! file "$EXECUTABLE_PATH" | grep -q "Mach-O"; then
            echo "ERROR: Executable is not Mach-O"
            exit 1
          fi

          if ! file "$EXECUTABLE_PATH" | grep -q "arm64"; then
            echo "ERROR: Executable is not arm64"
            exit 1
          fi

          chmod +x "$EXECUTABLE_PATH"

          echo "$APP_PATH" > "$PWD/app_path.txt"

      - name: Package unsigned IPA
        if: success()
        run: |
          set -euxo pipefail

          APP_PATH="$(cat "$PWD/app_path.txt")"

          rm -rf "$PWD/Payload"
          rm -f "$PWD/vox.Force.ipa"

          mkdir -p "$PWD/Payload"
          cp -R "$APP_PATH" "$PWD/Payload/"

          echo "======================================"
          echo "PAYLOAD CONTENTS"
          echo "======================================"

          find "$PWD/Payload" -maxdepth 4 -print

          cd "$PWD"
          /usr/bin/zip -qry "vox.Force.ipa" Payload

          ls -lh vox.Force.ipa

      - name: Validate final IPA
        if: success()
        run: |
          set -euxo pipefail

          rm -rf "$PWD/ipa-check"
          mkdir "$PWD/ipa-check"

          unzip -q "$PWD/vox.Force.ipa" -d "$PWD/ipa-check"

          APP_PATH="$PWD/ipa-check/Payload/vox.Force.app"

          if [ ! -d "$APP_PATH" ]; then
            echo "ERROR: Payload/vox.Force.app missing"
            exit 1
          fi

          EXECUTABLE_NAME="$(
            /usr/libexec/PlistBuddy \
              -c 'Print :CFBundleExecutable' \
              "$APP_PATH/Info.plist"
          )"

          EXECUTABLE_PATH="$APP_PATH/$EXECUTABLE_NAME"

          if [ ! -f "$EXECUTABLE_PATH" ]; then
            echo "ERROR: IPA does not contain the executable"
            exit 1
          fi

          file "$EXECUTABLE_PATH"

          if ! file "$EXECUTABLE_PATH" | grep -q "Mach-O"; then
            echo "ERROR: Final executable is not Mach-O"
            exit 1
          fi

          if ! file "$EXECUTABLE_PATH" | grep -q "arm64"; then
            echo "ERROR: Final executable is not arm64"
            exit 1
          fi

          echo "======================================"
          echo "IPA VALIDATION PASSED"
          echo "======================================"

      - name: Upload unsigned IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: vox.Force-unsigned-ipa
          path: vox.Force.ipa
          if-no-files-found: error
          retention-days: 7
